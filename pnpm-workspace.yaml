packages:
  - 'apps/packages/*'
  - 'apps/blocks'
  - 'apps/blocks-pro'
  - 'apps/app-admin'
  - 'tests/e2e'
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  esbuild: false
  fs-ext-extra-prebuilt: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@wordpress/eslint-plugin@25.5.1'
  - '@wordpress/scripts@32.5.1'
  - '@wordpress/stylelint-config@23.41.1'
  - '@wordpress/theme@0.17.0'
